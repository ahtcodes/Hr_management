{% extends "base.html" %}

{% block title %}
Add Manager Feedback — PeopleDesk HR
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">

        <h1>Add Manager Feedback</h1>

        <p class="text-muted">
            Provide feedback for an employee.
        </p>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Employee
                    </label>

                    <select name="employee_id"
                            class="form-select"
                            required>

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                        <option value="{{ employee.id }}">
                            {{ employee.full_name }}
                            — {{ employee.employee_code }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Rating
                    </label>

                    <select name="rating"
                            class="form-select"
                            required>

                        <option value="1">
                            1 — Needs Improvement
                        </option>

                        <option value="2">
                            2 — Below Expectations
                        </option>

                        <option value="3" selected>
                            3 — Meets Expectations
                        </option>

                        <option value="4">
                            4 — Very Good
                        </option>

                        <option value="5">
                            5 — Excellent
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Feedback
                    </label>

                    <textarea name="feedback"
                              class="form-control"
                              rows="6"
                              placeholder="Write manager feedback..."
                              required></textarea>

                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Feedback
                    </button>

                    <a href="{{ url_for('manager_feedback.feedback_list') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
