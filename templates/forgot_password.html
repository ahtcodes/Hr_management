{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-2">
                        Forgot Password
                    </h2>

                    <p class="text-muted">
                        Enter your username or email address.
                    </p>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username or Email
                            </label>

                            <input
                                type="text"
                                name="username_or_email"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Continue
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a href="{{ url_for('auth.login') }}">
                            Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
