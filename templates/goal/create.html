{% extends "base.html" %}

{% block title %}
Create Goal — PeopleDesk HR
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">
        <h1>Create Goal</h1>
        <p class="text-muted">
            Create a performance goal for an employee.
        </p>
    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Employee
                    </label>

                    <select name="employee_id"
                            class="form-select"
                            required>

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                        <option value="{{ employee.id }}">
                            {{ employee.full_name }}
                            — {{ employee.employee_code }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Goal Title
                    </label>

                    <input type="text"
                           name="title"
                           class="form-control"
                           placeholder="e.g. Complete 10 projects"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Describe the goal"></textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Target
                    </label>

                    <input type="text"
                           name="target"
                           class="form-control"
                           placeholder="e.g. 10 projects">

                </div>


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Progress (%)
                        </label>

                        <input type="number"
                               name="progress"
                               class="form-control"
                               value="0"
                               min="0"
                               max="100">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select name="status"
                                class="form-select">

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="In Progress">
                                In Progress
                            </option>

                            <option value="Completed">
                                Completed
                            </option>

                        </select>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Start Date
                        </label>

                        <input type="date"
                               name="start_date"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            End Date
                        </label>

                        <input type="date"
                               name="end_date"
                               class="form-control">

                    </div>

                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Create Goal
                    </button>

                    <a href="{{ url_for('goal.goal_list') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
