{% extends "base.html" %}

{% block title %}
Add Asset — PeopleDesk HR
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">

        <h1>Add New Asset</h1>

        <p class="text-muted">
            Add a company laptop, mobile, SIM or office equipment.
        </p>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="row g-3">


                    <!-- Asset Code -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Asset Code
                        </label>

                        <input
                            type="text"
                            name="asset_code"
                            class="form-control"
                            placeholder="e.g. LAP-001"
                            required
                        >

                    </div>


                    <!-- Asset Type -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Asset Type
                        </label>

                        <select
                            name="asset_type"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Asset Type
                            </option>

                            <option value="Laptop">
                                Laptop
                            </option>

                            <option value="Mobile">
                                Mobile
                            </option>

                            <option value="SIM">
                                SIM
                            </option>

                            <option value="Office Equipment">
                                Office Equipment
                            </option>

                        </select>

                    </div>


                    <!-- Asset Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Asset Name
                        </label>

                        <input
                            type="text"
                            name="asset_name"
                            class="form-control"
                            placeholder="e.g. Dell Latitude 5420"
                            required
                        >

                    </div>


                    <!-- Brand -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Brand
                        </label>

                        <input
                            type="text"
                            name="brand"
                            class="form-control"
                            placeholder="e.g. Dell"
                        >

                    </div>


                    <!-- Model -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Model
                        </label>

                        <input
                            type="text"
                            name="model"
                            class="form-control"
                            placeholder="e.g. Latitude 5420"
                        >

                    </div>


                    <!-- Serial Number -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Serial Number
                        </label>

                        <input
                            type="text"
                            name="serial_number"
                            class="form-control"
                        >

                    </div>


                    <!-- Purchase Date -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Purchase Date
                        </label>

                        <input
                            type="date"
                            name="purchase_date"
                            class="form-control"
                        >

                    </div>


                    <!-- Purchase Price -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Purchase Price
                        </label>

                        <input
                            type="number"
                            name="purchase_price"
                            class="form-control"
                            step="0.01"
                            min="0"
                            value="0"
                        >

                    </div>


                    <!-- Description -->

                    <div class="col-12">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            placeholder="Asset details..."
                        ></textarea>

                    </div>


                </div>


                <!-- Buttons -->

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Asset
                    </button>

                    <a
                        href="{{ url_for('asset.asset_list') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
