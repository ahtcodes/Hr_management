{% extends "base.html" %}

{% block title %}
Edit Shift — PeopleDesk HR
{% endblock %}


{% block content %}

<div class="container">

    <div class="greeting-row">

        <div class="greeting-text">
            <h1>Edit Shift</h1>
            <p class="greeting-sub">
                Update employee working shift details.
            </p>
        </div>

    </div>


    <div class="content-card">

        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Shift Name
                </label>

                <input 
                    type="text"
                    name="shift_name"
                    class="form-control"
                    value="{{ shift.shift_name }}"
                    required>

            </div>



            <div class="row">


                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Start Time
                    </label>

                    <input 
                        type="time"
                        name="start_time"
                        id="start_time"
                        class="form-control"
                        value="{{ shift.start_time.strftime('%H:%M') }}"
                        oninput="calculateEndTime()"
                        required>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Working Hours
                    </label>

                    <input 
                        type="number"
                        step="0.5"
                        name="working_hours"
                        id="working_hours"
                        class="form-control"
                        value="{{ shift.working_hours }}"
                        oninput="calculateEndTime()"
                        required>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        End Time (Auto-calculated)
                    </label>

                    <input 
                        type="time"
                        id="end_time"
                        name="end_time"
                        class="form-control"
                        value="{{ shift.end_time.strftime('%H:%M') }}"
                        readonly>

                </div>


            </div>



            <button type="submit" class="btn btn-primary">
                Update Shift
            </button>


            <a href="/admin/shifts" class="btn btn-secondary">
                Back
            </a>


        </form>


</div>


</div>


<script>
function calculateEndTime() {
    const start = document.getElementById('start_time');
    const hours = document.getElementById('working_hours');
    const end = document.getElementById('end_time');

    if (!start.value || !hours.value) {
        end.value = '';
        return;
    }

    const [sh, sm] = start.value.split(':').map(Number);
    const totalMinutes = sh * 60 + sm + parseFloat(hours.value) * 60;

    const endMinutes = totalMinutes % (24 * 60);
    const eh = String(Math.floor(endMinutes / 60)).padStart(2, '0');
    const em = String(Math.round(endMinutes % 60)).padStart(2, '0');

    end.value = eh + ':' + em;
}

// Calculate on page load
calculateEndTime();
</script>


{% endblock %}
