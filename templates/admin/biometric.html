{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Biometric Integration</h1>
            <p class="text-muted">
                Manage biometric attendance devices
            </p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">

            <h5 class="card-title">
                Biometric Device
            </h5>

            <div class="row mt-4">

                <div class="col-md-6">
                    <p>
                        <strong>Device Name:</strong>
                        Main Office Device
                    </p>

                    <p>
                        <strong>Device ID:</strong>
                        BIO-001
                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span class="badge bg-success">
                            Connected (Demo)
                        </span>
                    </p>
                </div>

                <div class="col-md-6 text-md-end">

                   <form method="POST"
                        action="{{ url_for('admin.biometric_sync') }}">

                        <button type="submit" class="btn btn-primary">
                            🔄 Sync Attendance
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
