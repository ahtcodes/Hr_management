{% extends "base.html" %}

{% block title %}
Rejected Employees
{% endblock %}

{% block content %}

<div class="container mt-4">

<h2 class="mb-4">Rejected Employees</h2>

<div class="card shadow">

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-danger">

<tr>

<th>ID</th>

<th>Username</th>

<th>Email</th>

<th>Status</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>{{ user.username }}</td>

<td>{{ user.email }}</td>

<td>

<span class="badge bg-danger">

{{ user.status }}

</span>

</td>

</tr>

{% else %}

<tr>

<td colspan="4" class="text-center">

No Rejected Employees

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

{% endblock %}
