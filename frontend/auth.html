<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PeopleDesk HR</title>
  <meta name="description" content="Sign in to PeopleDesk HR to manage employees, attendance, leave approvals and payroll.">
  <meta property="og:title" content="Sign in — PeopleDesk HR">
  <meta property="og:description" content="Sign in to PeopleDesk HR to manage employees, attendance, leave approvals and payroll.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='oklch(0.58 0.17 279)'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>">
</head>
<body>

  <!-- ================================
       AUTH PAGE
  ================================ -->
  <div class="auth-page bg-brand-gradient">

    <div class="auth-card animate-slide-up">

      <!-- Head Block -->
      <div class="auth-head">
        <div class="auth-icon-circle bg-brand-gradient">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <h1>PeopleDesk HR</h1>
        <p>Sign in to your HR workspace</p>
      </div>

      <!-- Form -->
      <form class="auth-form" id="authForm">

        <!-- Email -->
        <div class="form-group">
          <label for="email">Work email</label>
          <div class="form-input-wrapper">
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="sana.malik@nexustech.pk"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-input-wrapper">
            <input
              type="password"
              id="password"
              class="form-input password-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <!-- Eye icon (visible when password is hidden) -->
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <!-- EyeOff icon (visible when password is shown) -->
              <svg id="eyeOffIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
        </div>

        <!-- Keep me signed in + Forgot password -->
        <div class="form-row">
          <label class="checkbox-group">
            <input type="checkbox" checked>
            <span>Keep me signed in</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit">Sign in</button>

      </form>

      <!-- Footer -->
      <div class="auth-footer">
        New employee? <a href="index.html">Request an account</a>
      </div>

    </div>

  </div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>

  <script>
    (function() {
      // ================================
      // Theme Toggle
      // ================================
      const themeToggle = document.getElementById('themeToggle');
      const html = document.documentElement;

      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        html.classList.add('dark');
      }

      themeToggle.addEventListener('click', function() {
        html.classList.toggle('dark');
        localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
      });

      // ================================
      // Password Visibility Toggle
      // ================================
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');

      let passwordVisible = false;

      toggleBtn.addEventListener('click', function() {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        eyeIcon.style.display = passwordVisible ? 'none' : 'block';
        eyeOffIcon.style.display = passwordVisible ? 'block' : 'none';
        toggleBtn.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
      });

      // ================================
      // Form Submit (no backend)
      // ================================
      const authForm = document.getElementById('authForm');
      authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        // Demo: just redirect to dashboard
        window.location.href = 'index.html';
      });
    })();
  </script>

</body>
</html>
